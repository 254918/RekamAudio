name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RekamAudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekam-audio-apk
          path: RekamAudio.apk
          retention-days: 7

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk
          name: Rekam Audio
          body: |
            Rekam Audio APK (v1.1.0)

            - Chinese localization (zh-CN / zh-TW)
            - WAV / M4A / MP3 recording formats
            - Playback seek bar
            - Draggable floating record button

            Download `RekamAudio.apk` below and install it on your Android device.
          files: RekamAudio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
